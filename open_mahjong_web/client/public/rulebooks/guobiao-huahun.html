<h1>国标（花混癞子）规则书</h1>
<p>①起和限制，0赖子和1赖子8番起和，2赖子16番起和，3赖子32番起和，4赖子64番起和。</p>
<p>②无赖子和牌时结算时番数额外加八番或者直接番数翻倍（默认额外加八番）</p>
<p>③赖子只能在摸到手的时候摸切，不准手切，他家点出的癞子无法点和和牌（起手赖子不得打出）</p>
<p>④手中摸到四个赖子可以花杠，和牌时剩下手牌必须符合基本和牌型，花杠算88番。</p>
<p>⑤（四朵红花用作赖子的情况下）补的黑花在结算时一朵算4番，两朵8番，三朵16番，四朵32番</p>
<p>⑥四朵红花是春夏秋冬，四朵黑花是梅兰竹菊，自摸/点和癞子不算绝张，癞子能构成独听条件时构成独听（设置默认关闭癞子多面听）</p>
