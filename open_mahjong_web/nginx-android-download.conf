# Include once inside the website's server {} block. Adjust the Node port if needed.
# Keep these rules across releases; no APK version or hash belongs in Nginx.
# A fresh visit to the historical URL resolves the current verified package.
# Content/version/framework API requests keep using the site's existing /api
# proxy to Node; their metadata responses are no-store. Versioned ZIP downloads
# also work through Node (Range supported).
location ^~ /api/client-updates/android/ {
    expires off;
    proxy_cache off;
    proxy_buffering off;
    gzip off;
    proxy_pass http://127.0.0.1:8082;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /android-game/open_mahjong_unity.apk {
    expires off;
    proxy_cache off;
    proxy_pass http://127.0.0.1:8082/api/client-updates/android/download;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Cache-Control: no-store comes from Node. No local add_header directive:
    # preserve inherited site security headers on Nginx versions before 1.29.3.
}

# Deployment diagnostics may still read the raw sidecar. Force revalidation.
location = /android-game/android-update.json {
    root /www/wwwroot/salasasa.cn/dist;
    expires -1;
    try_files $uri =404;
}
