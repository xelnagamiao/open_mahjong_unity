              ht=hts[i];
              t=ht.dataset['val'];
              if(typeof(t)!=='undefined'){
                ht.className='tl tl-bg';
              }
            }
          }
        }
      };
      p.prev_stp=function(){
        this.pauseplay();
        if(this.stp>0){
        --this.stp;
        this.rfsh_all();
        }
      };
      p.ff_stp=function(){
        var st,k0,k;
        this.pauseplay();
        if(this.stp<17){
          this.stp=17;
          this.rfsh_all();
        }
        else{
          st=this.stat[++this.stp];
          if(st){
            k0=st['k'];
            do{
              st=this.stat[++this.stp];
              if(!st)break;
              k=st['k'];
            }while(k===k0);
            --this.stp;
            this.rfsh_all();
          }
          else{
            --this.stp;
            this.rfsh();
          }
        }
      };
      p.fr_stp=function(){
        var st,k,k0;
        this.pauseplay();
        if(this.stp<18){
          this.stp=0;
        }
        else{
          st=this.stat[this.stp];
          k0=st['k'];
          do{
            st=this.stat[--this.stp];
            if(!st)break;
            k=st['k'];
          }while(k===k0);
          if(this.stp<0)this.stp=0;
        }
        this.rfsh_all();
      };
      p.restart=function(){
        this.pauseplay();
        if(this.stp===0){
          this.res.style.display='none';
          return;
        }
        this.stp=0;
        this.rfsh_all();
      };
      p.finish=function(){
        var s=this.stp;
        this.pauseplay();
        do{++this.stp;}while(this.stat[this.stp]);
        --this.stp;
        if(s!==this.stp)this.rfsh_all();
        else this.res.style.display='inline';
      };
      p.prev=function(){
        if(this.prev_id){
          this.pauseplay();
          this.fetch(this.prev_id,-1);
        }
      };
      p.next=function(){
        if(this.next_id){
          this.pauseplay();
          this.fetch(this.next_id,1);
        }
      };
      p.autoplay=function(){
        this.playing=!this.playing;
        this.setupplay();
      };
      p.pauseplay=function(){
        this.playing=false;
        this.setupplay();
      };
      p.autonext=function(){
        var nxt,ts0,ts1,spd;
        if(!this.stat[++this.stp]){
          --this.stp;
          this.pauseplay();
        }
        else{
          this.rfsh();
          ts0=this.stat[this.stp]['ts'];
          nxt=this.stat[this.stp+1];
          if(nxt){
            ts1=nxt['ts'];
            spd=parseFloat(document.getElementById('spd').value||1);
            this.timer=setTimeout(this.autonext.bind(this),(ts1&&ts0)?(ts1-ts0)/spd:100);
          }
          else{
            this.pauseplay();
          }
        }
      };
      p.setupplay=function(){
        document.getElementById('autoplay').innerHTML=this.playing?'<i class="fa fa-pause" style="margin-right:.5em;" aria-hidden="true"></i>æå':'<i class="fa fa-play" style="margin-right:.5em;" aria-hidden="true"></i>æ­æ¾';
        if(this.playing){
          this.autonext();
        }
        else{
          if(this.timer){
            clearTimeout(this.timer);
            this.timer=null;
          }
        }
      };
      p.tglvw=function(v){
        if(v!==this.seat){
          var tt=this.stp;
          this.seat=v;
          this.init();
          this.stp=tt;
          this.rfsh_all();
          if(!this.stat[this.stp+1])--this.stp;
        }
      };
      p.tglcyc=function(v){
        this.pauseplay();
        for(this.stp=0;(this.stat[this.stp]['c']||0)<v;++this.stp);
        this.rfsh_all();
      };
      p.muswhl=function(y){
        if(y>0)this.next_stp();
        else if(y<0)this.prev_stp();
      };
      p.fetch=function(id,o,v,c){
        window.fetch('/_qry/record/',{
          method:'POST',
          credentials:'include',
          body:('id='+id)
        })
        .then(function(resp){
          return resp.json();
        })
        .then(function(json){
          this.setup(json,o,v,c);
          window.history.pushState(null,null,'/record/?id='+id+(v?'&v='+v:'')+(c?'&cy='+c:''));
        }.bind(this))
        .catch(function(e){
          console.log(e);
        });
      };
      return TZ;
    })();
    (function(){
      var sp=new URLSearchParams(window.location.search),id=sp.get('id'),tz=new TZ();
      tz.adapt();
      if(id){
        tz.fetch(id,0,sp.get('v'),sp.get('cy'));
      }
    })();
  </script>
</body>
</html>
