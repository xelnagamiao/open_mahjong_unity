<!-- 单页应用模板 -->
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index,follow" />
    <!-- 设置网页标题与描述（SEO TDK） -->
    <title>Salasasa国标麻将对战平台-萨拉飒飒</title>
    <meta name="description" content="支持国标麻将、立直麻将、长沙麻将、四川麻将、台湾麻将等一系列规则的开源麻将平台，提供2D、3D网页对战、数据站、牌理分析等多种功能；Salasasa平台也是open_mahjong_unity项目的示例服务器。" />
    <meta name="keywords" content="国标麻将,立直麻将,长沙麻将,四川麻将,台湾麻将,在线麻将,麻将平台,麻将计算器,麻将规则,Salasasa" />
    <link rel="canonical" href="https://salasasa.cn/" />
    <!-- 设置网页图标 -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- 社交分享（Open Graph） -->
    <meta property="og:site_name" content="Salasasa" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:url" content="https://salasasa.cn/" />
    <meta property="og:title" content="Salasasa国标麻将对战平台-萨拉飒飒" />
    <meta property="og:description" content="支持国标麻将、立直麻将、长沙麻将、四川麻将、台湾麻将等一系列规则的开源麻将平台，提供2D、3D网页对战、数据站、牌理分析等多种功能；Salasasa平台也是open_mahjong_unity项目的示例服务器。" />
  </head>
  <body>
    <!-- 渲染单页应用 -->
    <div id="app"></div>
    <!-- 指向 Vue 应用的渲染文件 -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
