# Include INSIDE the existing salasasa.cn server block, before other regex locations.
# Inherits the existing dist root; does not alter API, WebSocket or Unity locations.
# Use after building client/dist, then run nginx -t before reloading.

# Consolidate directory/index URLs on the canonical, slash-free URL.
location ~ ^/(en|fr|de|nl|es|it)/mcr/(?:index\.html)?$ {
    return 301 /$1/mcr$is_args$args;
}

# Serve real HTML; missing/unpublished languages must not fall back to the SPA.
location ~ ^/(en|fr|de|nl|es|it)/mcr$ {
    try_files $uri/index.html =404;
}

location ~ ^/(en|fr|de|nl|es|it)/mcr/ {
    return 404;
}

# A missing sitemap must not return the Chinese home-page HTML with HTTP 200.
location = /sitemap.xml {
    try_files /sitemap.xml =404;
}
